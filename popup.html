<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Nitrate</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="bar">
    <span class="mark" aria-hidden="true"></span>
    <h1>Nitrate</h1>
    <span class="version" id="version"></span>
  </header>

  <section class="hero">
    <p class="tier" id="tier">&mdash;</p>
    <p class="resolution" id="resolution">no signal</p>
    <p class="status" id="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Reading the player…</span>
    </p>
  </section>

  <dl class="readout" id="readout"></dl>

  <section class="controls">
    <h2>Controls</h2>
    <div id="controls"></div>
  </section>

  <script src="popup.js"></script>
</body>

</html>
