<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Nitrate</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body class="w-[340px]">

  <header class="flex items-baseline justify-between border-b border-line px-5 py-4">
    <h1 class="text-[15px] font-semibold tracking-[-0.02em]">Nitrate</h1>
    <span class="font-mono text-[10px] text-mute" id="version"></span>
  </header>

  <section class="px-5 pt-5">
    <p class="text-[30px] font-semibold leading-none tracking-[-0.03em]" id="tier">—</p>
    <p class="mt-2 font-mono text-[11px] text-dim" id="resolution">no signal</p>

    <p class="mt-4 flex items-start gap-2 text-[11.5px] leading-relaxed text-dim">
      <span class="mt-[3px] shrink-0 text-mute" id="statusIcon"></span>
      <span id="statusText">Reading the player…</span>
    </p>
  </section>

  <dl class="mt-5 px-5 font-mono text-[11px]" id="readout"></dl>

  <section class="mt-5 px-5">
    <h2 class="border-b border-line pb-2 font-mono text-[9.5px] uppercase tracking-[0.16em] text-mute">Controls</h2>
    <div id="controls"></div>
  </section>

  <footer class="flex items-center gap-2 px-5 pb-4 pt-1 font-mono text-[10px] text-mute">
    <span id="footIcon"></span>
    <span>ctrl shift alt N</span>
    <span class="text-mute/60">overlay</span>
  </footer>

  <script src="popup.js"></script>
</body>

</html>
